version: 2.1

# -------------------------
# Anchors / Reusable steps
# -------------------------
anchors:
  install_git: &install_git
    run:
      name: Install git and ssh
      command: |
        apt-get update
        apt-get install -y git openssh-client

  force_https: &force_https
    run:
      name: Force HTTPS GitHub checkout
      command: |
        git config --global url."https://github.com/".insteadOf "git@github.com:"

  restore_conda_cache: &restore_conda_cache
    restore_cache:
      keys:
        - conda-env-v1-{{ checksum "environment.yaml" }}

  save_conda_cache: &save_conda_cache
    save_cache:
      key: conda-env-v1-{{ checksum "environment.yaml" }}
      paths:
        - /opt/conda/envs/gnomad_db

  create_env: &create_env
    run:
      name: Create conda environment
      command: |
        if ! conda env list | grep -q gnomad_db; then
          mamba env create -f environment.yaml
        fi
        echo "source activate gnomad_db" >> ~/.bashrc

# -------------------------
# Workflows
# -------------------------
workflows:
  sample:
    jobs:
      - build-and-test
      - test_pip_install

# -------------------------
# Jobs
# -------------------------
jobs:
  build-and-test:
    docker:
      - image: condaforge/mambaforge
    steps:
      - *install_git
      - *force_https
      - checkout

      - *restore_conda_cache
      - *create_env
      - *save_conda_cache

      - run:
          name: Run workflow and tests
          command: |
            source activate gnomad_db
            snakemake --cores 1
            pip install .
            pytest test_dir/

  test_pip_install:
    docker:
      - image: cimg/python:3.9
    steps:
      - *force_https
      - checkout

      - restore_cache:
          keys:
            - pip-cache-v1-{{ checksum "requirements.txt" }}

      - run:
          name: Test pip installation
          command: |
            python -m venv venv
            . venv/bin/activate
            pip install --upgrade pip
            if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
            pip install .
            pytest test_dir/

      - save_cache:
          key: pip-cache-v1-{{ checksum "requirements.txt" }}
          paths:
            - ~/.cache/pip
